[package]
name = "mlua-isle"
version = "0.8.0"
edition = "2021"
rust-version = "1.88"
description = "Thread-isolated Lua VM with cancellation, async coroutines, and connection pool for mlua"
license = "MIT OR Apache-2.0"
authors = ["Yutaka Nishimura"]
repository = "https://github.com/ynishi/mlua-isle"
homepage = "https://github.com/ynishi/mlua-isle"
documentation = "https://docs.rs/mlua-isle"
keywords = ["lua", "mlua", "thread", "async", "pool"]
categories = ["concurrency", "api-bindings"]
readme = "README.md"
exclude = [".gitignore"]

[features]
default = []
pool = []
tokio = ["dep:tokio", "mlua/async"]
serde = ["mlua/serialize", "dep:serde_json"]

[dependencies]
mlua = { version = "0.12", features = ["lua54", "vendored"] }
thiserror = "2"
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["sync", "rt", "time", "macros"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
